<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&display=swap">
<style>
/* Layout: tek elle kullanılan telefon uygulaması — üstte "son ne zaman" kartları, ortada büyük dokun-kaydet düğmeleri, altta sekme çubuğu */
:root{
  --bg:#fbf7f2; --surface:#ffffff; --surface2:#f3ece4; --fg:#2f2a33; --muted:#7b7183; --line:#e8dfd5;
  --accent:#e9875e; --accent-ink:#ffffff; --sage:#6f9a86;
  --c-mama:#e9875e; --c-emz:#d16f8f; --c-cis:#d9a826; --c-kaka:#9b7353; --c-uyku:#6b78c9;
  --c-ilac:#4f9aa6; --c-ates:#d85a4f; --c-banyo:#4a9fd4; --c-olcum:#6f9a86; --c-not:#8b7fa0;
  --f-display:"Fredoka","Nunito Sans",system-ui,sans-serif;
  --f-body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#15161f; --surface:#1f2130; --surface2:#2a2d3f; --fg:#ece8f1; --muted:#a39cb0; --line:#33364a;
  --accent:#f09a72; --accent-ink:#1b1410; --sage:#8dbba6;
  --c-mama:#f09a72; --c-emz:#e78aa8; --c-cis:#e8c04d; --c-kaka:#c49a76; --c-uyku:#949fe8;
  --c-ilac:#72bcc7; --c-ates:#ef7d72; --c-banyo:#72bce8; --c-olcum:#8dbba6; --c-not:#b0a5c6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15161f; --surface:#1f2130; --surface2:#2a2d3f; --fg:#ece8f1; --muted:#a39cb0; --line:#33364a;
  --accent:#f09a72; --accent-ink:#1b1410; --sage:#8dbba6;
  --c-mama:#f09a72; --c-emz:#e78aa8; --c-cis:#e8c04d; --c-kaka:#c49a76; --c-uyku:#949fe8;
  --c-ilac:#72bcc7; --c-ates:#ef7d72; --c-banyo:#72bce8; --c-olcum:#8dbba6; --c-not:#b0a5c6;
  color-scheme:dark}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
img{max-width:100%}[hidden]{display:none!important}
button,.tap,nav.tabs{-webkit-user-select:none;user-select:none}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-top:14px}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.label{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
.head{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--surface2);display:grid;place-items:center;flex:none}
.avatar svg{width:30px;height:30px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.head .who{min-width:0;flex:1}
.head h1{font-size:24px;line-height:1.1}
.head .age{font-size:13px;color:var(--muted)}
.clock{font-family:var(--f-display);font-size:22px;color:var(--muted)}

/* son ne zaman */
.since{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.since .s{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 10px 9px;min-width:0}
.since .s b{display:block;font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.15}
.since .s span{font-size:12px;color:var(--muted)}
.since .s i{display:block;width:22px;height:4px;border-radius:2px;margin-bottom:7px}
.nextfeed{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--surface2);border-radius:14px;padding:10px 14px;font-size:14px}
.nextfeed b{font-family:var(--f-display);font-size:18px;font-weight:600}
.nextfeed.late b{color:var(--c-ates)}

/* running timers */
.running{display:flex;flex-direction:column;gap:8px}
.run{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--tc);border-radius:16px;padding:12px 14px}
.run .dot{width:10px;height:10px;border-radius:50%;background:var(--tc);animation:pulse 1.6s ease-in-out infinite;flex:none}
.run .t{flex:1;min-width:0}
.run .t b{font-family:var(--f-display);font-size:24px;font-weight:600;display:block;line-height:1.1}
.run .t span{font-size:13px;color:var(--muted)}
.run button{border:0;background:var(--tc);color:var(--surface);font-weight:700;border-radius:12px;padding:12px 16px}
@keyframes pulse{50%{opacity:.35}}

/* big tap buttons */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tap{position:relative;border:0;border-radius:var(--r);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);
  min-height:104px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  transition:transform .12s ease, background .2s}
.tap:active{transform:scale(.95)}
.tap .ic{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--tc) 16%,transparent)}
.tap .ic svg{width:26px;height:26px;stroke:var(--tc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tap .nm{font-weight:700;font-size:14px}
.tap .sub{font-size:11px;color:var(--muted);line-height:1}
.tap.on{background:color-mix(in srgb,var(--tc) 14%,var(--surface));box-shadow:inset 0 0 0 2px var(--tc)}
.tap.flash{animation:flash .6s ease}
@keyframes flash{30%{background:color-mix(in srgb,var(--tc) 30%,var(--surface))}}
.hint{font-size:13px;color:var(--muted);text-align:center;margin-top:-6px}

/* today summary */
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center}
.sum div{background:var(--surface);border-radius:14px;padding:10px 4px;border:1px solid var(--line)}
.sum b{display:block;font-family:var(--f-display);font-size:20px;font-weight:600}
.sum span{font-size:11px;color:var(--muted)}

/* timeline */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.sec-h h2{font-size:19px}
.list{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border:0;background:none;text-align:left;width:100%;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .tm{font-family:var(--f-display);font-weight:500;font-size:16px;width:46px;flex:none}
.row .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--tc);flex:none}
.row .tx{flex:1;min-width:0}
.row .tx b{display:block;font-weight:700}
.row .tx span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.row .chev{color:var(--muted)}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.dayhead{font-weight:700;font-size:13px;color:var(--muted);padding:14px 2px 6px}

/* filters */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* charts */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px;margin-top:10px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.col .v{font-size:11px;font-weight:700}
.col .b{width:100%;max-width:30px;border-radius:7px 7px 3px 3px;background:var(--tc);min-height:3px}
.col .d{font-size:11px;color:var(--muted)}
.chartgrid{display:flex;flex-direction:column;gap:12px}
.growth{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.growth .g{display:flex;justify-content:space-between;font-size:14px;border-top:1px solid var(--line);padding-top:6px}

/* settings */
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface2);color:var(--fg)}
.btn.danger{background:transparent;color:var(--c-ates);box-shadow:inset 0 0 0 1px var(--c-ates)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.about{display:flex;flex-direction:column;gap:6px;font-size:14px}
.about a{color:var(--accent);font-weight:700;overflow-wrap:anywhere}
.sel{user-select:all;font-weight:700}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);display:flex;justify-content:center;
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav.tabs .in{display:grid;grid-template-columns:repeat(6,1fr);width:100%;max-width:560px}
nav.tabs button{position:relative;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,8,16,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;max-height:88vh;overflow:auto;
  padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:14px;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h3{font-size:21px;display:flex;align-items:center;gap:10px}
.sheet h3 i{width:12px;height:12px;border-radius:50%;background:var(--tc)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 11px;font-weight:700;font-size:14px}
.steps button[aria-pressed="true"]{background:var(--tc,var(--accent));color:var(--surface);border-color:transparent}
.acts{display:flex;gap:8px}
.acts .btn{flex:1}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:50;
  background:var(--fg);color:var(--bg);border-radius:14px;padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:calc(100% - 32px);font-weight:600}
.toast button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:8px 12px;font-weight:700}
.banner{display:flex;align-items:center;gap:12px;background:color-mix(in srgb,var(--accent) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 40%,transparent);border-radius:14px;padding:11px 14px;font-size:14px;text-align:left;width:100%}
.banner b{display:block}
.banner svg{width:26px;height:26px;stroke:var(--accent);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tracks{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.trk{border:0;border-radius:16px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);padding:14px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:86px}
.trk b{font-family:var(--f-display);font-weight:600;font-size:17px}
.trk span{font-size:12px;color:var(--muted)}
.trk[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--c-uyku);background:color-mix(in srgb,var(--c-uyku) 14%,var(--surface))}
.player{display:flex;flex-direction:column;gap:12px;background:var(--surface2);border-radius:var(--r);padding:16px}
.player .now{display:flex;align-items:center;gap:12px}
.player .now b{font-family:var(--f-display);font-size:20px;font-weight:600;display:block}
.wave{display:flex;gap:3px;align-items:end;height:22px;flex:none}
.wave i{width:4px;background:var(--c-uyku);border-radius:2px;height:30%;animation:wv 1.2s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.2s}.wave i:nth-child(3){animation-delay:.4s}.wave i:nth-child(4){animation-delay:.6s}
@keyframes wv{50%{height:100%}}
input[type=range]{padding:0;accent-color:var(--c-uyku)}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0}
.toggle span{min-width:0}
.toggle small{display:block;color:var(--muted);font-size:12.5px}
.sw{appearance:none;-webkit-appearance:none;width:50px;height:30px;border-radius:15px;background:var(--line);position:relative;flex:none;padding:0;border:0;cursor:pointer;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw:checked{background:var(--sage)}.sw:checked::after{transform:translateX(20px)}
.appt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;background:none;text-align:left;width:100%;border-top:1px solid var(--line)}
.appt:first-child{border-top:0}
.appt .cal{width:50px;flex:none;text-align:center;border-radius:12px;background:color-mix(in srgb,var(--c-ilac) 16%,transparent);padding:5px 0;line-height:1.1}
.appt .cal b{display:block;font-family:var(--f-display);font-size:20px;font-weight:600;color:var(--c-ilac)}
.appt .cal span{font-size:11px;font-weight:700;color:var(--c-ilac);text-transform:uppercase;letter-spacing:.04em}
.appt .tx{flex:1;min-width:0}.appt .tx b{display:block}.appt .tx span{display:block;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.soon{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--surface2);white-space:nowrap}
.soon.hot{background:color-mix(in srgb,var(--c-ates) 18%,transparent);color:var(--c-ates)}
.addbtn{border:1px dashed var(--line);background:none;border-radius:var(--r);padding:12px;font-weight:700;color:var(--muted)}
.pharm{display:flex;flex-direction:column;gap:10px}
.pharm .ph{display:flex;align-items:center;gap:12px}
.pharm .ph .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c-ates) 14%,transparent);flex:none}
.pharm .ph .ic svg{width:24px;height:24px;stroke:var(--c-ates);fill:none;stroke-width:2.2;stroke-linecap:round}
.pharm .links{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pharm a{display:flex;align-items:center;justify-content:center;text-align:center;text-decoration:none;font-weight:700;border-radius:12px;padding:12px 8px;font-size:14px;background:var(--surface2);color:var(--fg)}
.pharm a.main{grid-column:1/-1;background:var(--c-ates);color:var(--surface)}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--c-ates);color:#fff;font-size:11px;line-height:18px;padding:0 5px}
.stk{display:flex;flex-direction:column;gap:8px;padding:13px 14px;border-top:1px solid var(--line)}
.stk:first-child{border-top:0}
.stk .top{display:flex;align-items:center;gap:10px}
.stk .nm{flex:1;min-width:0;border:0;background:none;text-align:left;padding:0}
.stk .nm b{display:block;font-weight:700}
.stk .nm span{display:block;font-size:12.5px;color:var(--muted)}
.stk .q{font-family:var(--f-display);font-size:22px;font-weight:600;text-align:right;line-height:1}
.stk .q small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:600;display:block;margin-top:2px}
.stk.low .q{color:var(--c-ates)}
.stk .plus{width:42px;height:42px;border-radius:12px;border:0;background:var(--surface2);font-size:22px;font-weight:700;flex:none}
.meter{height:6px;border-radius:3px;background:var(--surface2);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--sage)}
.stk.low .meter i{background:var(--c-ates)}
.shop{display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--c-ates) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--c-ates) 35%,transparent);border-radius:var(--r);padding:14px}
.shop ul{margin:0;padding-left:18px}
.tk{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-top:1px solid var(--line)}
.tk:first-child{border-top:0}
.tk .h{display:flex;justify-content:space-between;gap:8px;align-items:center}
.tk p{margin:0;font-size:14px;overflow-wrap:anywhere;white-space:pre-wrap}
.tk .reply{background:var(--surface2);border-radius:10px;padding:8px 10px;font-size:13.5px}
.st{font-size:11.5px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap;background:var(--surface2)}
.st.open{background:color-mix(in srgb,var(--c-cis) 22%,transparent)}
.st.done{background:color-mix(in srgb,var(--sage) 22%,transparent)}
.sync{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:360px){.grid{gap:8px}.tap{min-height:96px}.sum{grid-template-columns:repeat(2,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

}

function usedBy(it,e){
  if(it.rule==="bez")return(e.type==="cis"||e.type==="kaka")?(+it.per||1):0;
  if(it.rule==="kaka")return e.type==="kaka"?(+it.per||1):0;
  if(it.rule==="banyo")return e.type==="banyo"?(+it.per||1):0;
  if(it.rule==="mama")return e.type==="mama"&&(!e.kind||e.kind==="Mama")?(+e.ml||0)*(+it.per||4.5)/30:0;
  return 0}
function usage(it,from,to){let u=0;for(const e of S.events){if(e.ts<from)break;if(e.ts<to)u+=usedBy(it,e)}return u}
function stockNow(it){return Math.max(0,(+it.base||0)-usage(it,+it.baseAt||0,Infinity))}
function perDay(it){if(!it.rule)return 0;const n=Date.now();return usage(it,n-7*864e5,n)/7}
const fmtQ=(q,u)=>{const r=u==="gram"||u==="ml"?Math.round(q):Math.round(q*10)/10;return String(r).replace(".",",")};
const lowItems=()=>STOCK.filter(it=>stockNow(it)<=(+it.min||0));
function checkStock(){
  lowItems().forEach(it=>{if(!(+it.base>0))return;const k=it.id+":"+it.baseAt;if(stAlerted[k])return;stAlerted[k]=1;try{localStorage.setItem(LS+".stAlerted",JSON.stringify(stAlerted))}catch(e){}
    const q=fmtQ(stockNow(it),it.unit);const t=`${it.name} azaldı, ${q} ${it.unit} kaldı.`;

function strip(e){const o={};for(const k in e)if(e[k]!==undefined&&e[k]!==""&&k!=="_local")o[k]=e[k];return o}

/* ---------- zaman yardımcıları ---------- */
const pad=n=>String(n).padStart(2,"0");
const hm=ts=>{const d=new Date(ts);return pad(d.getHours())+":"+pad(d.getMinutes())};
const dayKey=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())};
const startOfDay=ts=>{const d=new Date(ts);d.setHours(0,0,0,0);return d.getTime()};
function dur(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),h=Math.floor(m/60);return h?`${h}sa ${m%60}dk`:`${m}dk`}
function clockDur(ms){const s=Math.floor(Math.max(0,ms)/1000);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return (h?h+":"+pad(m):m)+":"+pad(x)}
function ago(ts){const m=Math.floor((Date.now()-ts)/60000);if(m<1)return"az önce";if(m<60)return m+" dk önce";const h=Math.floor(m/60);if(h<24)return h+" sa "+(m%60?m%60+" dk ":"")+"önce";return Math.floor(h/24)+" gün önce"}
const GUN=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];
const AY=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
function dayLabel(ts){const t=startOfDay(Date.now()),d=startOfDay(ts);if(d===t)return"Bugün";if(d===t-864e5)return"Dün";const x=new Date(ts);return x.getDate()+" "+AY[x.getMonth()]+" "+GUN[x.getDay()]}
function age(birth){
  if(!birth)return"Doğum tarihini Ayarlar’dan ekle";
  const b=new Date(birth+"T00:00"),n=new Date();if(isNaN(b))return"";
  const days=Math.floor((startOfDay(n)-b.getTime())/864e5);if(days<0)return"";
  let mo=(n.getFullYear()-b.getFullYear())*12+n.getMonth()-b.getMonth();if(n.getDate()<b.getDate())mo--;
  const w=Math.floor(days/7);
  if(mo<1)return`${days} günlük · ${w} hafta`;
  const ref=new Date(b);ref.setMonth(b.getMonth()+mo);const d=Math.floor((startOfDay(n)-ref.getTime())/864e5);
  return mo<24?`${mo} ay ${d} günlük`:`${Math.floor(mo/12)} yaş ${mo%12} ay`;
}
const toLocalInput=ts=>{const d=new Date(ts);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+hm(ts)};

function detail(e){
  const p=[];
  if(e.type==="mama"){if(e.ml)p.push(e.ml+" ml");if(e.kind)p.push(e.kind)}
  if(e.type==="emzirme"){if(e.side)p.push(e.side);if(e.end)p.push(dur(e.end-e.ts))}
  if(e.type==="uyku"&&e.end)p.push(dur(e.end-e.ts)+" · "+hm(e.ts)+"–"+hm(e.end));
  if(e.type==="kaka"){if(e.color)p.push(e.color);if(e.cons)p.push(e.cons)}
  if(e.type==="ates"&&e.val)p.push(String(e.val).replace(".",",")+" °C");
  if(e.type==="ilac"&&e.med)p.push(e.med+(e.dose?" · "+e.dose:""));
  if(e.type==="olcum"){if(e.kg)p.push(String(e.kg).replace(".",",")+" kg");if(e.cm)p.push(e.cm+" cm");if(e.head)p.push("baş "+e.head+" cm")}
  if(e.note)p.push(e.note);
  return p.join(" · ");
}

function vToday(){
  const lf=lastFeed(),lc=last("cis"),lk=last("kaka"),lu=S.events.find(e=>e.type==="uyku"&&e.end);
  const sinceCard=(lbl,e,col,extra)=>`<div class="s"><i style="background:var(${col})"></i><span>${lbl}</span><b class="num">${e?hm(e.ts):"—"}</b><span>${e?ago(extra||e.ts):"kayıt yok"}</span></div>`;
  let next="";
  if(lf){const due=lf.ts+(+S.profile.feedEvery||180)*60000,late=Date.now()>due;
    next=`<div class="nextfeed${late?" late":""}"><span>${late?"Mama saati geçti":"Sıradaki mama"}<br><span class="muted">${(+S.profile.feedEvery||180)/60} saatte bir</span></span><b class="num">${hm(due)} <span class="muted" style="font-size:13px;font-family:var(--f-body)">${late?dur(Date.now()-due)+" geçti":dur(due-Date.now())+" kaldı"}</span></b></div>`}
  const runs=["uyku","emzirme"].filter(k=>S.timers[k]).map(k=>{const t=S.timers[k];
    return `<div class="run" style="--tc:var(${T[k].col})"><span class="dot"></span><div class="t"><b class="num" data-run="${k}">${clockDur(Date.now()-t.start)}</b><span>${k==="uyku"?"Uyuyor · "+hm(t.start)+"’den beri":"Emziriyor · "+(t.side||"")+" · "+hm(t.start)}</span></div>
    ${k==="emzirme"?`<button data-swap="1" style="background:var(--surface2);color:var(--fg)">Taraf değiş</button>`:""}<button data-stop="${k}">${k==="uyku"?"Uyandı":"Bitti"}</button></div>`}).join("");
  const tiles=ORDER.map(k=>{const on=T[k].timer&&S.timers[k];
    return `<button class="tap${on?" on":""}" data-tap="${k}" style="--tc:var(${T[k].col})"><span class="ic">${svg(k)}</span><span class="nm">${T[k].nm}</span><span class="sub">${on?(k==="uyku"?"Uyandır":"Bitir"):T[k].sub||"&nbsp;"}</span></button>`}).join("");
  const t0=startOfDay(Date.now()),today=S.events.filter(e=>e.ts>=t0);
  const feeds=today.filter(e=>e.type==="mama"||e.type==="emzirme").length,ml=today.filter(e=>e.type==="mama").reduce((a,e)=>a+(+e.ml||0),0);
  const diapers=today.filter(e=>e.type==="cis"||e.type==="kaka").length;
  const sleep=sleepIn(t0,t0+864e5);
  const banner=!audioOn?`<button class="banner" data-unlock="1">${svg("not","--accent").replace(I.not,'<path d="M11 5L6 9H2v6h4l5 4V5zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/>')}<span><b>Sesli uyarıları aç</b>Mama saati ve eşinin kayıtları için bir kez dokun.</span></button>`:"";
  const low=lowItems();
  const lowB=low.length?`<button class="banner" data-tab-go="stok" style="background:color-mix(in srgb,var(--c-ates) 12%,var(--surface));border-color:color-mix(in srgb,var(--c-ates) 40%,transparent)"><svg viewBox="0 0 24 24" aria-hidden="true" style="stroke:var(--c-ates)"><path d="M12 9v4M12 17h.01M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg><span><b>Stok azaldı</b>${low.map(it=>esc(it.name)+": "+fmtQ(stockNow(it),it.unit)+" "+esc(it.unit)).join(" · ")}</span></button>`:"";

function vHistory(){

function sleepIn(a,b){let ms=0;S.events.forEach(e=>{if(e.type==="uyku"&&e.end){const s=Math.max(a,e.ts),en=Math.min(b,e.end);if(en>s)ms+=en-s}});
  if(S.timers.uyku){const s=Math.max(a,S.timers.uyku.start),en=Math.min(b,Date.now());if(en>s)ms+=en-s}return ms}
function vCharts(){
  const days=[];for(let i=6;i>=0;i--){const a=startOfDay(Date.now())-i*864e5;days.push(a)}
  const data=days.map(a=>{const ev=S.events.filter(e=>e.ts>=a&&e.ts<a+864e5);return{
    a,feed:ev.filter(e=>e.type==="mama"||e.type==="emzirme").length,ml:ev.filter(e=>e.type==="mama").reduce((s,e)=>s+(+e.ml||0),0),
    cis:ev.filter(e=>e.type==="cis").length,kaka:ev.filter(e=>e.type==="kaka").length,uyku:sleepIn(a,a+864e5)/36e5}});
  const chart=(title,key,col,fmt)=>{const max=Math.max(1,...data.map(d=>d[key]));

function checkAppts(){
  const now=Date.now();
  APPTS.forEach(a=>{if(!a.leads||!a.leads.length||a.ts<=now)return;
    const due=a.leads.filter(m=>now>=a.ts-m*60000&&!apAlerted[a.id+":"+m]);if(!due.length)return;
    due.forEach(m=>apAlerted[a.id+":"+m]=1);try{localStorage.setItem(LS+".apAlerted",JSON.stringify(apAlerted))}catch(e){}
    const left=a.ts-now,dd=Math.round((startOfDay(a.ts)-startOfDay(now))/864e5);
    const when=dd>=1?(dd===1?"Yarın ":dd+" gün sonra ")+saatSoz(a.ts).toLowerCase():"Bugün "+saatSoz(a.ts).toLowerCase()+", "+(left<36e5?Math.max(1,Math.round(left/60000))+" dakika kaldı":Math.round(left/36e5)+" saat kaldı");
    const txt=`Doktor randevusu hatırlatması. ${when}. ${a.kind||""}${a.doctor?", "+a.doctor:""}${a.place?", "+a.place:""}.`;
    if(AC){const c=AC.currentTime;[0,1.2].forEach(d=>{tone(659,c+d,.8,.2);tone(988,c+d+.2,1,.16)})}
    alertOut("appt",txt,when+".",2600,false);toast("Randevu: "+dayLabel(a.ts)+" "+hm(a.ts)+(a.doctor?" · "+a.doctor:""));
    if(navigator.vibrate)try{navigator.vibrate([300,150,300])}catch(x){}
  });
}

async function tap(k,btn){
  if(!writable){toast("Bu sayfada kayıt yetkin yok.");return}
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}
  if(btn){btn.classList.remove("flash");void btn.offsetWidth;btn.classList.add("flash")}
  if(T[k].timer){
    if(S.timers[k])return stopTimer(k);
    if(k==="emzirme"){const le=last("emzirme");const side=le&&le.side==="Sol"?"Sağ":"Sol";
      const st=Date.now();myStarts.add(st);await setMeta("timers",Object.assign({},S.timers,{emzirme:{start:st,side}}));if(N.speak&&N.self&&N.types.includes("emzirme"))announceStart("emzirme",{start:st,side});else toast("Emzirme başladı · "+side);return}
    {const st=Date.now();myStarts.add(st);await setMeta("timers",Object.assign({},S.timers,{uyku:{start:st}}));if(N.speak&&N.self&&N.types.includes("uyku"))announceStart("uyku",{start:st});else toast("Uyku başladı");return;}
  }
  const e={type:k,ts:Date.now()};
  if(k==="mama"){e.ml=+S.profile.defaultMl||90;e.kind="Mama"}
  if(k==="olcum"||k==="ates"||k==="ilac"||k==="not"){sheet(e,true);return}
  await addEvent(e);
  toast(T[k].nm+" kaydedildi · "+hm(e.ts),"Ayrıntı",()=>{const x=S.events.find(y=>y.id===e.id)||e;sheet(x)});
}
async function stopTimer(k){
  const t=S.timers[k];if(!t)return;
  const e={type:k,ts:t.start,end:Date.now()};if(t.side)e.side=t.side;
  const nt=Object.assign({},S.timers);delete nt[k];
  await addEvent(e);await setMeta("timers",nt);
  toast(T[k].nm+" kaydedildi · "+dur(e.end-e.ts),"Ayrıntı",()=>{const x=S.events.find(y=>y.id===e.id)||e;sheet(x)});
}
async function swapSide(){
  const t=S.timers.emzirme;if(!t)return;
  const e={type:"emzirme",ts:t.start,end:Date.now(),side:t.side};await addEvent(e);
  const side=t.side==="Sol"?"Sağ":"Sol";
  const st=Date.now();myStarts.add(st);await setMeta("timers",Object.assign({},S.timers,{emzirme:{start:st,side}}));toast(side+" göğse geçildi");
}

function noiseBuf(brown){const len=AC.sampleRate*3,b=AC.createBuffer(1,len,AC.sampleRate),d=b.getChannelData(0);let last=0;

function bell(f,t,d,v){[[1,v],[2.76,v*.18],[5.4,v*.06]].forEach(([m,vv])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f*m;

  return header()+(tr?`<div class="player"><div class="now"><span class="wave"><i></i><i></i><i></i><i></i></span><span style="flex:1;min-width:0"><b>${tr.nm}</b><span class="muted num" id="pleft">${P.ends?clockDur(P.ends-Date.now())+" sonra kapanır":"Kapanmadan çalıyor"}</span></span><button class="btn" id="pstop" style="background:var(--c-uyku);color:var(--surface)">Durdur</button></div>
    <div class="field"><label for="vol">Ses seviyesi</label><input id="vol" type="range" min="0.05" max="1" step="0.05" value="${P.vol}"></div></div>`:
    `<div class="card"><h2 style="font-size:19px">Uyku sesleri</h2><p class="muted" style="margin:6px 0 0">Bir sese dokun, çalmaya başlasın. Süre bitince sesi yavaşça kısarak kapanır.</p></div>`)+
  `<div class="field"><label>Kapanma süresi</label><div class="chips">${[[15,"15 dk"],[30,"30 dk"],[45,"45 dk"],[60,"1 saat"],[0,"Sürekli"]].map(([m,n])=>`<button class="chip" data-tmin="${m}" aria-pressed="${P.min===m}">${n}</button>`).join("")}</div></div>
  <div class="tracks">${TRACKS.map(t=>`<button class="trk" data-track="${t.id}" aria-pressed="${P.track===t.id}"><b>${t.nm}</b><span>${t.sub}</span></button>`).join("")}</div>
  <button class="btn ghost" data-wake="1">${wakeLock?"Ekran açık tutuluyor · kapat":"Ekranı açık tut (ses kesilmesin)"}</button>
  <p class="muted" style="font-size:12.5px;margin:0">Telefon kilitlenirse ses durabilir. Ekranı açık tut ve parlaklığı kıs. Hoparlörü bebeğin başından en az 1 metre uzakta, kısık seste tut.</p>`;
}

render();

/* ---------- bulut bağlantısı ---------- */
(async()=>{
  try{
    const P_=window.__pispis;
    const d=P_?await P_.ready():null;
    if(!d)return;
    db=d;mode="db";
    const user=null;ME=P_.uid;IS_OWNER=false;
    if(ME)db.doc("support/"+ME).onSnapshot(s=>{MY_SUP=s.exists?s.data():{tickets:[]};if(tab==="ayar"&&!layer.innerHTML&&!document.activeElement.closest?.("#supf,[data-rin]"))render()},()=>{});
    if(IS_OWNER)db.collection("support").onSnapshot(snap=>{ALL_SUP=snap.docs.map(x=>Object.assign({id:x.id},x.data()));if(tab==="ayar"&&!layer.innerHTML&&!document.activeElement.closest?.("#supf,[data-rin]"))render()},()=>{});
    if(user&&user.can){const w=await user.can("data.write");if(w===false)writable=false}
    // telefonda daha önce tutulan kayıtları buluta taşı
    const local=S.events.slice();let first=true;
    db.collection("events").orderBy("ts","desc").limit(1000).onSnapshot(snap=>{
      if(!first){snap.docChanges().forEach(ch=>{if(ch.type!=="added")return;const e=Object.assign({id:ch.doc.id},ch.doc.data());
        if(!mine.has(e.id)&&N.speak&&N.types.includes(e.type)&&Date.now()-(e.end||e.ts)<30*60000)announce(e)})}
      S.events=snap.docs.map(x=>Object.assign({id:x.id},x.data()));
      if(first&&!snap.metadata.fromCache){first=false;
        const have=new Set(S.events.map(x=>x.id));
        local.filter(x=>!have.has(x.id)).forEach(x=>db.collection("events").doc(x.id).set(strip(x)).catch(()=>{}));
      }
      render();
    },()=>{toast("Bulut bağlantısı kesildi")});
    db.doc("meta/profile").onSnapshot(s=>{if(s.exists){S.profile=Object.assign({},S.profile,s.data());render()}});
    const localV=Object.assign({},VOICES);let vFirst=true;
    db.collection("voices").onSnapshot(snap=>{const o={};snap.docs.forEach(x=>o[x.id]=x.data());VOICES=o;
      if(vFirst&&!snap.metadata.fromCache){vFirst=false;Object.keys(localV).forEach(k=>{if(!o[k])db.collection("voices").doc(k).set(localV[k]).catch(()=>{})})}
      if(!layer.innerHTML)render()},()=>{});
    const localSt=STOCK.slice();let stFirst=true;
    db.collection("stock").onSnapshot(snap=>{STOCK=snap.docs.map(x=>Object.assign({id:x.id},x.data()));
      if(stFirst&&!snap.metadata.fromCache){stFirst=false;const h=new Set(STOCK.map(x=>x.id));localSt.filter(x=>!h.has(x.id)).forEach(x=>db.collection("stock").doc(x.id).set(strip(x)).catch(()=>{}))}
      render()},()=>{});
    const localAp=APPTS.slice();let apFirst=true;
    db.collection("appts").onSnapshot(snap=>{APPTS=snap.docs.map(x=>Object.assign({id:x.id},x.data()));
      if(apFirst&&!snap.metadata.fromCache){apFirst=false;const h=new Set(APPTS.map(x=>x.id));localAp.filter(x=>!h.has(x.id)).forEach(x=>db.collection("appts").doc(x.id).set(strip(x)).catch(()=>{}))}
      render()},()=>{});
    let tFirst=true;
    db.doc("meta/timers").onSnapshot(s=>{const nt=s.exists?Object.assign({},s.data()):{};
      if(!tFirst&&N.speak){["uyku","emzirme"].forEach(k=>{const t=nt[k];if(t&&t.start&&(!S.timers[k]||S.timers[k].start!==t.start)&&!myStarts.has(t.start)&&N.types.includes(k)&&Date.now()-t.start<30*60000)announceStart(k,t)})}
      if(!s.metadata.fromCache)tFirst=false;S.timers=nt;render()});
    render();
  }catch(e){}
})();
})();
</script>
