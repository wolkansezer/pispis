name: iOS · TestFlight'e yükle

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Gizli ayarları kontrol et
        run: |
          for v in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID; do
            if [ -z "${!v}" ]; then echo "::error::GitHub Secrets içinde $v eksik. KURULUM.md dosyasına bak."; exit 1; fi
          done

      - name: Xcode sürümünü seç
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_16*.app | sort -V | tail -1)"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Web paketini derle
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: App Store Connect API anahtarını yaz
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          KEY_FILE="$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8"
          # Secret, .p8 dosyasının düz metni ya da base64 hâli olabilir.
          if printf '%s' "$ASC_KEY_RAW" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$ASC_KEY_RAW" > "$KEY_FILE"
          else
            printf '%s' "$ASC_KEY_RAW" | tr -d ' \r\n' | base64 --decode > "$KEY_FILE"
          fi
          grep -q "BEGIN PRIVATE KEY" "$KEY_FILE" || { echo "::error::APP_STORE_CONNECT_KEY_BASE64 okunamadı. .p8 dosyasının içeriğini olduğu gibi yapıştır."; exit 1; }
        env:
          ASC_KEY_RAW: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}

      - name: Arşivle (imzasız; imza yükleme adımında atılır)
        run: |
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Pispis.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive -quiet

      - name: App Store Connect'e yükle
        run: |
          sed "s/__TEAM_ID__/$TEAM_ID/" ios/App/ci/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Pispis.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Yükleme tamam. Derleme birkaç dakika içinde App Store Connect › TestFlight'ta görünür."

      - name: Anahtarı sil
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
